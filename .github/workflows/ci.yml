name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        # The MCP client supports both SDK generations (aim_mcp/server.py
        # imports MCPServer from 2.x and falls back to FastMCP from 1.x).
        # A declared support that pip picks at random is not tested: pin
        # the generation so both are, every time.
        mcp-sdk: ["<2", ">=2"]
    name: tests (py${{ matrix.python-version }}, mcp${{ matrix.mcp-sdk }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./server[dev] -e ./mcp[dev] "mcp${{ matrix.mcp-sdk }}"

      # What actually got resolved, so a failure is diagnosable from the
      # log alone (the SDK generation, pydantic, starlette...).
      - name: Resolved versions
        run: pip freeze

      - name: Server suite
        working-directory: server
        run: python -m pytest -q

      - name: Client suite
        working-directory: mcp
        run: python -m pytest -q

      # Not in any suite and not in the wheel, so nothing else would notice
      # it rotting: it must at least run to completion.
      - name: Memory layer demo (smoke)
        working-directory: server
        run: python demo_memory_layer.py > /dev/null

      - name: Build wheels and check packaging
        run: |
          pip wheel ./server --no-deps -w dist/
          pip wheel ./mcp --no-deps -w dist/
          python -c "
          import glob, zipfile
          wheel = glob.glob('dist/aim_server*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert 'aim_server/static/ui.html' in names, 'web UI missing from wheel'
          print('wheels OK, UI packaged')
          "

  lower-bounds:
    # The declared dependency floors (pkg>=X in pyproject.toml) are a
    # promise to whoever installs on an older environment. This job
    # installs exactly those versions and runs the suites, so a floor that
    # is too low fails here instead of on somebody's machine. Each package
    # gets its own environment, like on a real server or client machine:
    # the server's floors and the client's floors need not coexist.
    runs-on: ubuntu-latest
    name: tests (lowest declared versions)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Server at its floors
        run: |
          python -m venv .venv-server
          .venv-server/bin/pip install --upgrade pip
          .venv-server/bin/pip install -e ./server[dev] $(python .github/scripts/floor_pins.py server/pyproject.toml)
          .venv-server/bin/pip freeze
          cd server && ../.venv-server/bin/python -m pytest -q

      - name: Client at its floors
        run: |
          python -m venv .venv-client
          .venv-client/bin/pip install --upgrade pip
          .venv-client/bin/pip install -e ./server -e ./mcp[dev] $(python .github/scripts/floor_pins.py mcp/pyproject.toml)
          .venv-client/bin/pip freeze
          cd mcp && ../.venv-client/bin/python -m pytest -q
